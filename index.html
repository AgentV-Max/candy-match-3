<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candy Match — Match-3 Puzzle</title>
<style>
  :root {
    --gap: 6px;
    --cell: 56px;
    --board-bg: #2b2140;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Verdana, Arial, sans-serif;
    background: radial-gradient(circle at top, #4b3b78 0%, #1c1530 70%);
    color: #f4f0ff;
    padding: 20px;
  }

  .game {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  h1 {
    margin: 0;
    font-size: 1.8rem;
    letter-spacing: 1px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }

  .stats {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .stat-box {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 8px 18px;
    min-width: 100px;
    text-align: center;
    backdrop-filter: blur(4px);
  }

  .stat-box .label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.7;
  }

  .stat-box .value {
    font-size: 1.4rem;
    font-weight: 700;
  }

  #reset-btn {
    background: linear-gradient(135deg, #ff7ab6, #7a5cff);
    border: none;
    color: white;
    font-weight: 700;
    padding: 10px 22px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.95rem;
    box-shadow: 0 4px 14px rgba(122, 92, 255, 0.5);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  #reset-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(122, 92, 255, 0.65);
  }

  #reset-btn:active {
    transform: translateY(0);
  }

  #message {
    min-height: 1.4em;
    font-size: 1rem;
    font-weight: 600;
    color: #ffd166;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  .board {
    position: relative;
    display: grid;
    grid-template-columns: repeat(8, var(--cell));
    grid-template-rows: repeat(8, var(--cell));
    gap: var(--gap);
    padding: 10px;
    background: var(--board-bg);
    border-radius: 16px;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.06), 0 10px 30px rgba(0,0,0,0.4);
    touch-action: none;
    user-select: none;
  }

  .cell {
    width: var(--cell);
    height: var(--cell);
    border-radius: 12px;
    position: relative;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.25s ease, left 0.25s ease, top 0.25s ease, opacity 0.2s ease;
    box-shadow: inset 0 -4px 6px rgba(0,0,0,0.25), inset 0 3px 4px rgba(255,255,255,0.35);
  }

  .cell::after {
    content: '';
    position: absolute;
    inset: 6px;
    border-radius: 8px;
    background: rgba(255,255,255,0.15);
    pointer-events: none;
  }

  .cell.selected {
    box-shadow: 0 0 0 3px #fff, inset 0 -4px 6px rgba(0,0,0,0.25), inset 0 3px 4px rgba(255,255,255,0.35);
    transform: scale(1.08);
    z-index: 5;
  }

  .cell.matched {
    animation: pop 0.35s ease forwards;
    z-index: 2;
  }

  .cell.falling {
    animation: none;
  }

  @keyframes pop {
    0%   { transform: scale(1);   opacity: 1; }
    50%  { transform: scale(1.3); opacity: 0.7; }
    100% { transform: scale(0);   opacity: 0; }
  }

  @keyframes dropIn {
    from { transform: translateY(-40px); opacity: 0; }
    to   { transform: translateY(0);     opacity: 1; }
  }

  .cell.new {
    animation: dropIn 0.3s ease;
  }

  .cell.type-0 { background: linear-gradient(160deg, #ff6b81, #e84158); }
  .cell.type-1 { background: linear-gradient(160deg, #6bcBff, #2e86ff); }
  .cell.type-2 { background: linear-gradient(160deg, #7bed9f, #21a84a); }
  .cell.type-3 { background: linear-gradient(160deg, #ffe36b, #f5a623); }
  .cell.type-4 { background: linear-gradient(160deg, #d19bff, #9146ff); }

  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(10, 6, 20, 0.72);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 8;
  }

  .flash-overlay {
    position: absolute;
    inset: 0;
    border-radius: 16px;
    background: rgba(255,255,255,0.4);
    opacity: 0;
    pointer-events: none;
    z-index: 4;
  }

  .flash-overlay.flash {
    animation: flash-fade 0.4s ease-out;
  }

  @keyframes flash-fade {
    0%   { opacity: 0.75; }
    100% { opacity: 0; }
  }

  .particles-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 6;
  }

  .particle {
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    left: 0;
    top: 0;
    box-shadow: 0 0 4px rgba(255,255,255,0.5);
    animation: particle-burst 0.6s ease-out forwards;
  }

  @keyframes particle-burst {
    0% {
      transform: translate(-50%, -50%) translate(0, 0) scale(1);
      opacity: 1;
    }
    100% {
      transform: translate(-50%, -50%) translate(var(--dx), var(--dy)) scale(0.2);
      opacity: 0;
    }
  }

  .board.shake {
    animation: board-shake 0.4s ease;
  }

  @keyframes board-shake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-6px, 3px); }
    40% { transform: translate(6px, -3px); }
    60% { transform: translate(-4px, 2px); }
    80% { transform: translate(4px, -2px); }
  }

  .combo-popup {
    position: absolute;
    top: 42%;
    left: 50%;
    font-size: 2rem;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 3px 10px rgba(0,0,0,0.6), 0 0 22px rgba(255, 209, 102, 0.85);
    opacity: 0;
    pointer-events: none;
    z-index: 10;
    white-space: nowrap;
  }

  .combo-popup.show {
    animation: combo-pop 0.8s ease-out forwards;
  }

  @keyframes combo-pop {
    0%   { opacity: 0; transform: translate(-50%, -30%) scale(0.4); }
    20%  { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    35%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    75%  { opacity: 1; transform: translate(-50%, -62%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -80%) scale(0.9); }
  }

  .overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  .overlay h2 {
    margin: 0;
    font-size: 1.6rem;
  }

  .overlay p {
    margin: 0;
    opacity: 0.85;
  }

  @media (max-width: 520px) {
    :root { --cell: 38px; --gap: 4px; }
    h1 { font-size: 1.3rem; }
  }
</style>
</head>
<body>

<div class="game">
  <h1>🍬 Candy Match</h1>

  <div class="stats">
    <div class="stat-box">
      <div class="label">Score</div>
      <div class="value" id="score">0</div>
    </div>
    <div class="stat-box">
      <div class="label">Moves Left</div>
      <div class="value" id="moves">30</div>
    </div>
  </div>

  <div id="message">&nbsp;</div>

  <div class="board" id="board">
    <div class="flash-overlay" id="flash"></div>
    <div class="particles-layer" id="particles"></div>
    <div class="combo-popup" id="combo-popup"></div>
    <div class="overlay" id="overlay">
      <h2 id="overlay-title">Game Over</h2>
      <p id="overlay-text">Final Score: 0</p>
    </div>
  </div>

  <button id="reset-btn">Reset Game</button>
</div>

<script>
(function () {
  const SIZE = 8;
  const TYPES = 5;
  const START_MOVES = 30;

  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const movesEl = document.getElementById('moves');
  const messageEl = document.getElementById('message');
  const overlayEl = document.getElementById('overlay');
  const overlayTitleEl = document.getElementById('overlay-title');
  const overlayTextEl = document.getElementById('overlay-text');
  const resetBtn = document.getElementById('reset-btn');
  const flashEl = document.getElementById('flash');
  const particlesEl = document.getElementById('particles');
  const comboPopupEl = document.getElementById('combo-popup');

  const TYPE_COLORS = ['#ff6b81', '#2e86ff', '#21a84a', '#f5a623', '#9146ff'];
  const COMBO_WORDS = ['', 'Sweet!', 'Great!', 'Awesome!', 'Fantastic!', 'Incredible!'];

  let grid = [];          // grid[row][col] = type index
  let cellEls = [];       // cellEls[row][col] = DOM element
  let score = 0;
  let movesLeft = START_MOVES;
  let selected = null;    // {row, col}
  let dragStart = null;   // {row, col}
  let busy = false;       // true while animations / resolving matches
  let gameOver = false;

  function randType() {
    return Math.floor(Math.random() * TYPES);
  }

  // --- Audio (Web Audio API, no external files) ---
  let audioCtx = null;

  function ensureAudio() {
    if (!audioCtx) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      audioCtx = new Ctx();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playTone({ freq = 440, duration = 0.15, type = 'sine', volume = 0.2, delay = 0 }) {
    if (!audioCtx) return;
    const t0 = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(volume, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.03);
  }

  function playSwapSound() {
    playTone({ freq: 320, duration: 0.09, type: 'triangle', volume: 0.12 });
  }

  function playInvalidSound() {
    playTone({ freq: 140, duration: 0.18, type: 'sawtooth', volume: 0.12 });
  }

  function playMatchSound(combo) {
    const base = 440 * Math.pow(1.12, Math.min(combo - 1, 8));
    playTone({ freq: base, duration: 0.16, type: 'sine', volume: 0.18 });
    playTone({ freq: base * 1.5, duration: 0.16, type: 'sine', volume: 0.1, delay: 0.05 });
  }

  function playGameOverSound() {
    [440, 349, 293, 220].forEach((f, i) => {
      playTone({ freq: f, duration: 0.3, type: 'triangle', volume: 0.15, delay: i * 0.15 });
    });
  }

  // --- Juice: particles, shake, flash, combo popups ---
  function spawnParticles(r, c, typeIndex) {
    const cellEl = cellEls[r][c];
    const cx = cellEl.offsetLeft + cellEl.offsetWidth / 2;
    const cy = cellEl.offsetTop + cellEl.offsetHeight / 2;
    const color = TYPE_COLORS[typeIndex] || '#fff';
    const count = 7;
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + (Math.random() * 0.6 - 0.3);
      const dist = 26 + Math.random() * 22;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist;
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = cx + 'px';
      p.style.top = cy + 'px';
      p.style.background = color;
      p.style.setProperty('--dx', dx + 'px');
      p.style.setProperty('--dy', dy + 'px');
      particlesEl.appendChild(p);
      p.addEventListener('animationend', () => p.remove());
    }
  }

  function triggerShake() {
    boardEl.classList.remove('shake');
    void boardEl.offsetWidth;
    boardEl.classList.add('shake');
  }

  function triggerFlash() {
    flashEl.classList.remove('flash');
    void flashEl.offsetWidth;
    flashEl.classList.add('flash');
  }

  function showComboPopupText(word) {
    comboPopupEl.textContent = word;
    comboPopupEl.classList.remove('show');
    void comboPopupEl.offsetWidth;
    comboPopupEl.classList.add('show');
  }

  function inBounds(r, c) {
    return r >= 0 && r < SIZE && c >= 0 && c < SIZE;
  }

  function createGridNoMatches() {
    const g = [];
    for (let r = 0; r < SIZE; r++) {
      g.push([]);
      for (let c = 0; c < SIZE; c++) {
        let t;
        do {
          t = randType();
        } while (
          (c >= 2 && g[r][c - 1] === t && g[r][c - 2] === t) ||
          (r >= 2 && g[r - 1][c] === t && g[r - 2][c] === t)
        );
        g[r].push(t);
      }
    }
    return g;
  }

  function buildBoardDom() {
    // remove existing cells (keep overlay)
    boardEl.querySelectorAll('.cell').forEach(el => el.remove());
    cellEls = [];
    for (let r = 0; r < SIZE; r++) {
      cellEls.push([]);
      for (let c = 0; c < SIZE; c++) {
        const el = document.createElement('div');
        el.classList.add('cell');
        el.dataset.row = r;
        el.dataset.col = c;
        el.style.gridRowStart = r + 1;
        el.style.gridColumnStart = c + 1;
        attachCellEvents(el);
        boardEl.appendChild(el);
        cellEls[r].push(el);
      }
    }
    renderAll();
  }

  function renderAll() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        renderCell(r, c);
      }
    }
  }

  function renderCell(r, c) {
    const el = cellEls[r][c];
    const t = grid[r][c];
    el.className = 'cell';
    if (t !== null && t !== undefined) {
      el.classList.add('type-' + t);
    }
    el.style.gridRowStart = r + 1;
    el.style.gridColumnStart = c + 1;
  }

  function setSelectedVisual() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        cellEls[r][c].classList.remove('selected');
      }
    }
    if (selected) {
      cellEls[selected.row][selected.col].classList.add('selected');
    }
  }

  function areAdjacent(a, b) {
    const dr = Math.abs(a.row - b.row);
    const dc = Math.abs(a.col - b.col);
    return (dr + dc) === 1;
  }

  function swapGrid(a, b) {
    const tmp = grid[a.row][a.col];
    grid[a.row][a.col] = grid[b.row][b.col];
    grid[b.row][b.col] = tmp;
  }

  function findMatches() {
    const matched = Array.from({ length: SIZE }, () => Array(SIZE).fill(false));
    let any = false;

    // horizontal
    for (let r = 0; r < SIZE; r++) {
      let runStart = 0;
      for (let c = 1; c <= SIZE; c++) {
        const same = c < SIZE && grid[r][c] === grid[r][runStart] && grid[r][c] !== null;
        if (!same) {
          const runLen = c - runStart;
          if (runLen >= 3) {
            for (let k = runStart; k < c; k++) { matched[r][k] = true; any = true; }
          }
          runStart = c;
        }
      }
    }

    // vertical
    for (let c = 0; c < SIZE; c++) {
      let runStart = 0;
      for (let r = 1; r <= SIZE; r++) {
        const same = r < SIZE && grid[r][c] === grid[runStart][c] && grid[r][c] !== null;
        if (!same) {
          const runLen = r - runStart;
          if (runLen >= 3) {
            for (let k = runStart; k < r; k++) { matched[k][c] = true; any = true; }
          }
          runStart = r;
        }
      }
    }

    return { matched, any };
  }

  function wouldMatch(a, b) {
    swapGrid(a, b);
    const { any } = findMatches();
    swapGrid(a, b); // revert
    return any;
  }

  function hasAnyPossibleMove() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (c < SIZE - 1) {
          const a = { row: r, col: c }, b = { row: r, col: c + 1 };
          if (wouldMatch(a, b)) return true;
        }
        if (r < SIZE - 1) {
          const a = { row: r, col: c }, b = { row: r + 1, col: c };
          if (wouldMatch(a, b)) return true;
        }
      }
    }
    return false;
  }

  async function clearMatchesLoop() {
    let totalCleared = 0;
    let comboMultiplier = 1;

    while (true) {
      const { matched, any } = findMatches();
      if (!any) break;

      // count and animate clear
      let clearedThisPass = 0;
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (matched[r][c]) {
            clearedThisPass++;
            spawnParticles(r, c, grid[r][c]);
            cellEls[r][c].classList.add('matched');
          }
        }
      }

      score += clearedThisPass * 10 * comboMultiplier;
      totalCleared += clearedThisPass;
      updateStats();
      playMatchSound(comboMultiplier);

      let popupWord = '';
      if (comboMultiplier >= 2) {
        popupWord = COMBO_WORDS[Math.min(comboMultiplier - 1, COMBO_WORDS.length - 1)];
      } else if (clearedThisPass >= 5) {
        popupWord = 'Nice!';
      }
      if (popupWord) {
        showComboPopupText(popupWord);
        triggerShake();
        triggerFlash();
      }

      await wait(320);

      // mark cleared cells as empty
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (matched[r][c]) grid[r][c] = null;
        }
      }

      applyGravityAndRefill();
      renderAll();
      await wait(260);

      comboMultiplier++;
    }

    return totalCleared;
  }

  function applyGravityAndRefill() {
    for (let c = 0; c < SIZE; c++) {
      const colValues = [];
      for (let r = SIZE - 1; r >= 0; r--) {
        if (grid[r][c] !== null) colValues.push(grid[r][c]);
      }
      const newCol = [];
      while (newCol.length < SIZE - colValues.length) newCol.push(randType());
      const fullColBottomUp = colValues.concat(newCol); // bottom-up order after fall
      for (let r = SIZE - 1, i = 0; r >= 0; r--, i++) {
        grid[r][c] = fullColBottomUp[i];
      }
    }
  }

  function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function updateStats() {
    scoreEl.textContent = score;
    movesEl.textContent = Math.max(0, movesLeft);
  }

  function showMessage(text) {
    messageEl.textContent = text;
    clearTimeout(showMessage._t);
    showMessage._t = setTimeout(() => {
      if (messageEl.textContent === text) messageEl.textContent = ' ';
    }, 1600);
  }

  async function attemptSwap(a, b) {
    if (busy || gameOver) return;
    if (!areAdjacent(a, b)) return;

    busy = true;
    selected = null;
    setSelectedVisual();

    swapGrid(a, b);
    renderAll();
    playSwapSound();
    await wait(180);

    const { any } = findMatches();

    if (!any) {
      // revert
      swapGrid(a, b);
      renderAll();
      playInvalidSound();
      showMessage('No match — try again!');
      await wait(180);
      busy = false;
      return;
    }

    movesLeft--;
    updateStats();

    await clearMatchesLoop();

    busy = false;

    if (movesLeft <= 0) {
      endGame();
    } else if (!hasAnyPossibleMove()) {
      showMessage('No moves left — reshuffling!');
      reshuffleBoard();
    }
  }

  function reshuffleBoard() {
    grid = createGridNoMatches();
    renderAll();
  }

  function endGame() {
    gameOver = true;
    overlayTitleEl.textContent = 'Game Over';
    overlayTextEl.textContent = 'Final Score: ' + score;
    overlayEl.classList.add('show');
    playGameOverSound();
  }

  function handleCellActivate(r, c) {
    if (busy || gameOver) return;
    const clicked = { row: r, col: c };

    if (!selected) {
      selected = clicked;
      setSelectedVisual();
      return;
    }

    if (selected.row === clicked.row && selected.col === clicked.col) {
      selected = null;
      setSelectedVisual();
      return;
    }

    if (areAdjacent(selected, clicked)) {
      const a = selected;
      const b = clicked;
      attemptSwap(a, b);
    } else {
      selected = clicked;
      setSelectedVisual();
    }
  }

  function attachCellEvents(el) {
    el.addEventListener('click', () => {
      const r = parseInt(el.dataset.row, 10);
      const c = parseInt(el.dataset.col, 10);
      handleCellActivate(r, c);
    });

    el.addEventListener('mousedown', (e) => {
      if (busy || gameOver) return;
      dragStart = { row: parseInt(el.dataset.row, 10), col: parseInt(el.dataset.col, 10) };
    });

    el.addEventListener('mouseup', (e) => {
      if (!dragStart || busy || gameOver) { dragStart = null; return; }
      const r = parseInt(el.dataset.row, 10);
      const c = parseInt(el.dataset.col, 10);
      const target = { row: r, col: c };
      if (dragStart.row !== target.row || dragStart.col !== target.col) {
        if (areAdjacent(dragStart, target)) {
          selected = null;
          setSelectedVisual();
          attemptSwap(dragStart, target);
        }
      }
      dragStart = null;
    });

    // touch support
    el.addEventListener('touchstart', (e) => {
      if (busy || gameOver) return;
      dragStart = { row: parseInt(el.dataset.row, 10), col: parseInt(el.dataset.col, 10) };
    }, { passive: true });

    el.addEventListener('touchend', (e) => {
      if (!dragStart || busy || gameOver) { dragStart = null; return; }
      const touch = e.changedTouches[0];
      const domEl = document.elementFromPoint(touch.clientX, touch.clientY);
      if (domEl && domEl.classList.contains('cell')) {
        const target = { row: parseInt(domEl.dataset.row, 10), col: parseInt(domEl.dataset.col, 10) };
        if (areAdjacent(dragStart, target)) {
          selected = null;
          setSelectedVisual();
          attemptSwap(dragStart, target);
        }
      }
      dragStart = null;
    });
  }

  async function initialCleanup() {
    // In case createGridNoMatches ever left a match (it shouldn't), clear it.
    const { any } = findMatches();
    if (any) {
      await clearMatchesLoop();
    }
  }

  function newGame() {
    score = 0;
    movesLeft = START_MOVES;
    selected = null;
    dragStart = null;
    busy = false;
    gameOver = false;
    overlayEl.classList.remove('show');
    messageEl.textContent = ' ';
    grid = createGridNoMatches();
    buildBoardDom();
    updateStats();
  }

  resetBtn.addEventListener('click', newGame);
  document.addEventListener('pointerdown', ensureAudio, { once: true });

  newGame();
})();
</script>

</body>
</html>
